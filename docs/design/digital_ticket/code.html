<style>
        body { font-family: 'Cairo', sans-serif; background-color: #f7f9fb; }
        .glass-panel { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border: 1px solid #E2E8F0; }
        .ticket-shape {
            mask-image: radial-gradient(circle at top left, transparent 12px, black 13px), 
                        radial-gradient(circle at top right, transparent 12px, black 13px), 
                        radial-gradient(circle at bottom left, transparent 12px, black 13px), 
                        radial-gradient(circle at bottom right, transparent 12px, black 13px);
            mask-position: top left, top right, bottom left, bottom right;
            mask-repeat: no-repeat;
            mask-size: 50% 50%;
        }
        .ticket-cutout {
            position: relative;
        }
        .ticket-cutout::before, .ticket-cutout::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 24px;
            height: 24px;
            background-color: #f7f9fb;
            border-radius: 50%;
            transform: translateY(-50%);
            z-index: 10;
        }
        .ticket-cutout::before { right: -12px; }
        .ticket-cutout::after { left: -12px; }
    </style>

    body {

<body class="bg-background text-on-background min-h-screen flex flex-col md:flex-row rtl">

            </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                رقم الحجز: <span class="font-bold">#C-847291</span>
</p>
</div>
<!-- Ticket Card -->

</div>
<div class="bg-secondary-container text-on-secondary-container px-3 py-1 rounded-full font-label-md text-label-md border border-secondary/20">
                        مؤكد
                    </div>
</div>
</div>
<!-- Ticket Body -->
<div class="p-md border-b border-dashed border-outline-variant/30">
<div class="grid grid-cols-2 gap-md mb-md">
<div>
<p class="font-label-md text-label-md text-on-surface-variant mb-base">التاريخ</p>
<p class="font-body-md text-body-md text-primary font-semibold">الأحد، ١٥ أكتوبر</p>
</div>
<div>

<p class="font-body-md text-body-md text-primary font-semibold">٠٨:٠٠ - ١١:٠٠ ص</p>
</div>
</div>
<div class="mb-md">
<p class="font-label-md text-label-md text-on-surface-variant mb-base">الاسم</p>
<p class="font-body-md text-body-md text-primary font-semibold">مينا أشرف</p>
</div>
<div class="grid grid-cols-2 gap-md">
<div>

</div>
