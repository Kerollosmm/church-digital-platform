<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.5);
            box-shadow: 0 4px 30px rgba(15, 23, 42, 0.1);
        }
        .deep-navy-bg {
            background-color: #0F172A; /* Using explicit hex for the deep navy request if primary-container isn't dark enough, but will stick to primary-container per instructions to use tokens */

             background-image: radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px);

<body class="bg-primary-container text-on-surface h-screen w-full flex items-center justify-center relative overflow-hidden font-display-lg">
<!-- Decorative Background Elements -->
<div class="absolute inset-0 bg-pattern opacity-20 pointer-events-none"></div>
<div class="absolute top-0 right-0 w-[500px] h-[500px] bg-secondary-container rounded-full blur-[120px] opacity-20 transform translate-x-1/3 -translate-y-1/3 pointer-events-none"></div>
<div class="absolute bottom-0 left-0 w-[600px] h-[600px] bg-tertiary-fixed rounded-full blur-[150px] opacity-10 transform -translate-x-1/3 translate-y-1/3 pointer-events-none"></div>
<!-- Main Auth Container -->
<main class="relative z-10 w-full max-w-md px-margin-mobile md:px-0">
<div class="glass-card rounded-2xl p-lg flex flex-col items-center w-full">
<!-- Branding / Logo Area -->
<div class="mb-md flex flex-col items-center">
<div class="w-16 h-16 rounded-full bg-surface-container-high flex items-center justify-center mb-sm shadow-sm border border-outline-variant/20">
<!-- Stylized Coptic Cross Motif -->
<span class="material-symbols-outlined text-primary text-4xl" style="font-variation-settings: 'FILL' 1;">
                        church
                    </span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary text-center">
                    الكنيسة القبطية الأرثوذكسية
                </h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center mt-base">
                    أهلاً بك في منصة الكنيسة Digital Platform
                </p>
</div>
<!-- Auth Form State 1: Phone Input -->
<div class="w-full flex flex-col gap-sm" id="phone-input-section">
<label class="font-label-md text-label-md text-on-surface text-right" for="phone-number">رقم الهاتف المحمول</label>
<div class="flex flex-row-reverse w-full h-12 rounded-lg border border-outline-variant bg-surface overflow-hidden focus-within:border-secondary focus-within:ring-1 focus-within:ring-secondary transition-all">
<!-- Prefix -->
<div class="flex items-center justify-center bg-surface-container-low px-sm border-l border-outline-variant text-on-surface font-body-md" dir="ltr">
<span class="text-on-surface-variant ml-1 font-label-md text-label-md">EG</span>
                        +20
                    </div>
<!-- Input -->
<input class="flex-1 bg-transparent border-none px-sm text-right font-body-lg text-body-lg text-primary focus:ring-0 placeholder:text-outline" dir="ltr" id="phone-number" oninput="this.value = this.value.replace(/[^0-9\s]/g, '')" placeholder="10 0000 0000" type="tel"/>
</div>
<button class="w-full h-12 mt-sm bg-primary text-on-primary rounded-lg font-label-md text-label-md hover:opacity-90 transition-opacity flex items-center justify-center gap-xs" onclick="showOtpSection()">
<span>إرسال رمز التحقق</span>
<span class="material-symbols-outlined" style="font-size: 18px;">send</span>
</button>
</div>
<!-- Auth Form State 2: OTP Input (Hidden by default) -->
<div class="w-full flex flex-col gap-sm hidden" id="otp-input-section">
<div class="flex flex-col items-center mb-sm">
<p class="font-label-md text-label-md text-on-surface-variant text-center">أدخل الرمز المكون من 6 أرقام المرسل إلى</p>
<p class="font-body-md text-body-md text-primary font-bold mt-base" dir="ltr" id="display-phone">+20 1X XXXX XXXX</p>
<button class="text-secondary font-label-md text-label-md mt-xs hover:underline" onclick="showPhoneSection()">تعديل الرقم</button>
</div>
<div class="flex flex-row-reverse justify-between gap-2 mb-sm w-full" dir="ltr">
<input class="w-12 h-14 text-center font-headline-md text-headline-md border border-outline-variant rounded-lg bg-surface focus:border-secondary focus:ring-1 focus:ring-secondary text-primary" id="otp1" maxlength="1" oninput="moveToNext(this, 'otp2')" type="text"/>
<input class="w-12 h-14 text-center font-headline-md text-headline-md border border-outline-variant rounded-lg bg-surface focus:border-secondary focus:ring-1 focus:ring-secondary text-primary" id="otp2" maxlength="1" oninput="moveToNext(this, 'otp3')" type="text"/>
<input class="w-12 h-14 text-center font-headline-md text-headline-md border border-outline-variant rounded-lg bg-surface focus:border-secondary focus:ring-1 focus:ring-secondary text-primary" id="otp3" maxlength="1" oninput="moveToNext(this, 'otp4')" type="text"/>
<input class="w-12 h-14 text-center font-headline-md text-headline-md border border-outline-variant rounded-lg bg-surface focus:border-secondary focus:ring-1 focus:ring-secondary text-primary" id="otp4" maxlength="1" oninput="moveToNext(this, 'otp5')" type="text"/>
<input class="w-12 h-14 text-center font-headline-md text-headline-md border border-outline-variant rounded-lg bg-surface focus:border-secondary focus:ring-1 focus:ring-secondary text-primary" id="otp5" maxlength="1" oninput="moveToNext(this, 'otp6')" type="text"/>
<input class="w-12 h-14 text-center font-headline-md text-headline-md border border-outline-variant rounded-lg bg-surface focus:border-secondary focus:ring-1 focus:ring-secondary text-primary" id="otp6" maxlength="1" oninput="verifyOtp()" type="text"/>
</div>
<button class="w-full h-12 bg-secondary text-on-secondary rounded-lg font-label-md text-label-md hover:bg-opacity-90 transition-all flex items-center justify-center gap-xs shadow-sm">
<span>تأكيد الدخول</span>
</button>
<div class="text-center mt-sm">
<p class="font-body-md text-body-md text-on-surface-variant">لم تستلم الرمز؟ <button class="text-secondary font-label-md text-label-md hover:underline">إعادة إرسال</button></p>
</div>
</div>
</div>
<!-- Footer / Support links -->
<div class="mt-lg flex justify-center gap-md">
<a class="font-label-md text-label-md text-inverse-primary hover:text-white transition-colors" href="#">سياسة الخصوصية</a>
<a class="font-label-md text-label-md text-inverse-primary hover:text-white transition-colors" href="#">الشروط والأحكام</a>
<a class="font-label-md text-label-md text-inverse-primary hover:text-white transition-colors" href="#">الدعم الفني</a>
</div>
</main>
<script>
        function showOtpSection() {
            const phoneVal = document.getElementById('phone-number').value;
            if(phoneVal.length > 8) {
                document.getElementById('phone-input-section').classList.add('hidden');
                document.getElementById('otp-input-section').classList.remove('hidden');
                document.getElementById('display-phone').innerText = `+20 ${phoneVal}`;
                document.getElementById('otp1').focus();
            } else {
                // simple validation shake or highlight could go here
                document.getElementById('phone-number').parentElement.classList.add('ring-2', 'ring-error', 'border-error');
                setTimeout(() => {
                    document.getElementById('phone-number').parentElement.classList.remove('ring-2', 'ring-error', 'border-error');
                }, 1000);
            }
        }

        function showPhoneSection() {
            document.getElementById('otp-input-section').classList.add('hidden');
            document.getElementById('phone-input-section').classList.remove('hidden');
        }

        function moveToNext(current, nextFieldId) {
            if (current.value.length === 1) {
                document.getElementById(nextFieldId).focus();
            }
        }
        
        function verifyOtp() {
             // Mock verification action
        }
    </script>
</body></html>
